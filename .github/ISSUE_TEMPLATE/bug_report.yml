name: Bug Report
description: Create a report to help us improve the Samanvaya framework
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce this bug? Please provide sample data or code if possible.
      placeholder: |
        1. Run `samanvaya align -s source.tif -r ref.tif`
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 22.04, Windows 11, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Samanvaya Version
      placeholder: v2.0.0
    validations:
      required: true
